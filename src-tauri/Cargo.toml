[package]
name = "otf-dz"
version = "0.1.0"
description = "Open Timeframe Algeria desktop application"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "otf_dz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
